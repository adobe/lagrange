# Pixi manifest for the C++ (Doxygen) documentation tooling.
#
# The doxygen version is pinned to match the one used to render the documentation website.

[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
doxygen = "~=1.13.2"

[environments]
docs = { features = [], solve-group = "docs" }
