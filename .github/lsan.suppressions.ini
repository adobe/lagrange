# LSAN suppression for known false positives in third-party system libraries.

# D-Bus client library — leaked allocations in libdbus-1.so during static init/shutdown.
leak:libdbus-1.so

# NVIDIA OpenGL driver — leaked allocations from libnvidia-glcore.so during GL context setup.
leak:libnvidia-glcore.so

# NVIDIA Vulkan ICD — leaked allocations reached through libGLX_nvidia.so during Vulkan context
# setup in SAL. Requires VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING=1 so the ICD stays mapped at exit.
leak:libGLX_nvidia.so
