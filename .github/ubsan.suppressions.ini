# UBSan suppressions for known third-party issues.
# Misha and Shape Gradient Domain use matrix objects in unconstructed heap storage.
vptr:/misha/
vptr:/shape_gradient_domain/
# TBB task dispatch reports invalid vptrs for task objects.
vptr:/tbb/
# Misha packs sparse-matrix entries with #pragma pack(2), so their double values are unaligned.
alignment:/texture_signal_processing/
alignment:Eigen::Triplet<
# PoissonRecon passes null pointers with zero sizes to memcpy.
nonnull-attribute:/poissonrecon/
# TinyEXR left-shifts signed 64-bit values.
shift-base:/tinyexr/
# Clang reports indirect calls through mismatched function types in these dependencies on macOS.
function:/catch2/
function:/instant-meshes-core/
function:/openvdb/
