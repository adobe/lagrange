name: Python wheel

on:
  pull_request:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build_wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15, windows-2025]

    name: ${{matrix.os}}
    runs-on: ${{matrix.os}}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Xcode version
        if: matrix.os == 'macos-15-intel'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.4'

      - name: Setup Xcode version
        if: matrix.os == 'macos-15'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.0.1'

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ARCHS_LINUX: auto64
          CIBW_ARCHS_WINDOWS: auto64
          # cibuildwheel 4 enables delvewheel repair on Windows by default.
          # Recognize the OpenVDB/TBB DLLs CMake already bundles and check their dependencies.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --ignore-existing -w {dest_dir} -v {wheel}"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_SKIP: "*-musllinux*"
          MACOSX_DEPLOYMENT_TARGET: 13.00
          CIBW_BUILD_VERBOSITY: 2

      - name: Test wheel on supported Python versions
        shell: bash
        run: |
          set -euxo pipefail
          wheels=(wheelhouse/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo "Expected exactly one wheel, found: ${wheels[*]}" >&2
            exit 1
          fi

          for python_version in 3.11 3.12 3.13 3.14 3.15; do
            uv run \
              --no-build \
              --isolated \
              --no-project \
              --no-config \
              --python "$python_version" \
              --with pytest \
              --with "${wheels[0]}" \
              python -m pytest -s modules
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{matrix.os}}
          path: ./wheelhouse/*.whl


  upload_pypi:
    name: Upload wheels to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheel]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Deploy wheel
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
