name: Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: ON
  CTEST_PARALLEL_LEVEL: 1

jobs:
  ####################
  # Linux / macOS
  ####################

  Unix:
    name: ${{ matrix.os }} (${{ matrix.compiler }}, ${{ matrix.config }}, ${{ matrix.sanitizer }}Sanitizer)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
        config: [RelWithDebInfo, Debug]
        compiler: [gcc, apple, llvm]
        sanitizer: ["Address", "Thread"] # TODO: Add Memory+Undefined Sanitizer
        exclude:
          - os: macos-15-intel
            compiler: gcc
          - os: macos-15-intel
            sanitizer: Thread
          - os: macos-15-intel
            config: Debug
          - os: macos-15
            compiler: gcc
          - os: ubuntu-24.04
            compiler: apple
    steps:
      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set swap space
        if: runner.os == 'Linux' && matrix.compiler == 'gcc' && matrix.config == 'RelWithDebInfo'
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 16

      - name: Show disk and memory space
        run: |
          echo "disk usage:"
          df -h
          echo "memory:"
          if command -v free &>/dev/null; then free -h; else sysctl hw.memsize; fi

      - name: Select build dir (Linux)
        if: runner.os == 'Linux'
        # Find mount point with the largest available space for our build dir...
        run: |
            space_cwd=$(df --output=avail . | tail -1 | tr -d ' ')
            space_mnt=$(df --output=avail /mnt 2>/dev/null | tail -1 | tr -d ' ')
            echo "Space available on ./: $space_cwd KB"
            echo "Space available on /mnt: $space_mnt KB"
            if [ -n "$space_mnt" ] && [ "$space_mnt" -gt "$space_cwd" ]; then
              echo "build_dir=/mnt/build" >> "$GITHUB_ENV"
              echo "Selected /mnt/build (/mnt has $((space_mnt/1024/1024)) GB free vs ./ has $((space_cwd/1024/1024)) GB free)"
              sudo mkdir -p /mnt/build
              sudo chown $USER /mnt/build
            else
              echo "build_dir=build" >> "$GITHUB_ENV"
              echo "Selected ./build (./ has $((space_cwd/1024/1024)) GB free)"
            fi

      - name: Select build dir (macOS)
        if: runner.os == 'macOS'
        run: echo "build_dir=build" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        # Note: Update to actions/checkout@6 once 6.0.2 is out, and remove the fetch-depth: 0
        # https://github.com/actions/checkout/issues/1471
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
            sudo apt-get update
            if [ "${{ matrix.compiler }}" = "gcc" ]; then
              sudo apt-get install -y g++
              echo "CC=gcc" >> $GITHUB_ENV
              echo "CXX=g++" >> $GITHUB_ENV
            else
              sudo apt-get install -y clang
              echo "CC=clang" >> $GITHUB_ENV
              echo "CXX=clang++" >> $GITHUB_ENV
            fi
            sudo apt-get install -y xorg-dev

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
            if [ "${{ matrix.compiler }}" = "llvm" ]; then
              brew install llvm@17
              echo "CC='$(brew --prefix llvm@17)/bin/clang'" >> $GITHUB_ENV
              echo "CXX='$(brew --prefix llvm@17)/bin/clang++'" >> $GITHUB_ENV
            fi

      - name: Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.sanitizer }}-${{ matrix.config }}

      - name: Setup Xcode version
        if: matrix.os == 'macos-15-intel'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup Xcode version
        if: matrix.os == 'macos-15'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Select embree isa (Linux)
        if: runner.os == 'Linux'
        run: echo "embree_max_isa=SSE2" >> $GITHUB_ENV

      - name: Select embree isa (macOS x64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: echo "embree_max_isa=DEFAULT" >> $GITHUB_ENV

      - name: Select embree isa (macOS arm64)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: echo "embree_max_isa=NONE" >> $GITHUB_ENV

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v1
        id: cpu-cores

      - name: Configure
        run: |
          cmake --version
          cmake -B ${{ env.build_dir }} -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DLAGRANGE_JENKINS=ON \
            -DLAGRANGE_ALL=ON \
            -DLAGRANGE_LIMIT_PARALLELISM=ON \
            -DOPENVDB_CORE_SHARED=ON \
            -DOPENVDB_CORE_STATIC=OFF \
            -DUSE_EXPLICIT_INSTANTIATION=OFF \
            -DLAGRANGE_POLYSCOPE_MOCK_BACKEND=ON \
            -DEMBREE_MAX_ISA=${{ env.embree_max_isa }} \
            -DUSE_SANITIZER="${{ matrix.sanitizer }}"

      - name: Build
        run: cmake --build ${{ env.build_dir }} -j ${{ steps.cpu-cores.outputs.count }}

      - name: Show disk space
        if: always()
        run: |
          echo "disk usage:"
          df -h

      - name: Tests
        run: cd ${{ env.build_dir }}; ctest --verbose -j ${{ steps.cpu-cores.outputs.count }}

  ####################
  # Windows
  ####################

  Windows:
    name: ${{ matrix.os }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        config: [Release, Debug]
    steps:
      - name: Show disk space
        run: Get-PSDrive

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: matrix.os != 'windows-11-arm'
        with:
          python-version: 3.13

        # Explicitly request arm64 architecture so that the Python dev files
        # (headers + python313.lib) are installed for ARM64, not just the interpreter.
        # Without this, CMake falls back to the x64 Python for Development.Module,
        # which the ARM64 MSVC toolchain cannot link against.
      - uses: actions/setup-python@v5
        if: matrix.os == 'windows-11-arm'
        with:
          python-version: 3.13
          architecture: arm64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set env variable for sccache
        run: |
          echo "appdata=$env:LOCALAPPDATA" >> ${env:GITHUB_ENV}
          # Disable idle timeout: embree AVX2 files take 12+ min each and can occupy all job slots,
          # starving sccache of requests until the default 600s timeout kills the server.
          echo "SCCACHE_IDLE_TIMEOUT=0" >> ${env:GITHUB_ENV}

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v1
        id: cpu-cores

      - name: Sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set x64 vars
        if: matrix.os == 'windows-2025'
        run: |
            echo "BUILD_DIR=D:/build" >> ${env:GITHUB_ENV}
            echo "ARCH=x64" >> ${env:GITHUB_ENV}

      - name: Set arm64 vars
        if: matrix.os == 'windows-11-arm'
        run: |
            echo "BUILD_DIR=C:/build" >> ${env:GITHUB_ENV}
            echo "ARCH=arm64" >> ${env:GITHUB_ENV}

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ env.ARCH }}

        # The windows-11-arm hostedtoolcache Python ships only the interpreter; it lacks
        # python3XX.lib and headers. We synthesize the import library from the ARM64 DLL
        # using MSVC lib.exe (available after msvc-dev-cmd), and copy arch-neutral headers
        # from the x64 Python if the arm64 install doesn't have them.
      - name: Fix Python ARM64 development files
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $pyDir = $env:pythonLocation

          # Locate the Python DLL (e.g. python313.dll)
          $dll = Get-ChildItem -Path $pyDir -Filter "python3*.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "No python3*.dll in $pyDir"; exit 1 }
          $dllBase = $dll.BaseName

          # Generate ARM64 import library if missing
          $libsDir = Join-Path $pyDir "libs"
          $libFile  = Join-Path $libsDir "$dllBase.lib"
          if (-not (Test-Path $libFile)) {
            New-Item -ItemType Directory -Force -Path $libsDir | Out-Null
            $raw     = & dumpbin /EXPORTS $dll.FullName 2>&1
            $exports = $raw | Where-Object { $_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+\w' } |
                       ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)') { $Matches[1] } }
            $defPath = "$env:TEMP\$dllBase.def"
            @("LIBRARY $dllBase", "EXPORTS") + $exports | Set-Content $defPath -Encoding ASCII
            & lib /DEF:$defPath /MACHINE:ARM64 /OUT:$libFile
            if ($LASTEXITCODE -ne 0) { Write-Error "lib.exe failed"; exit 1 }
            Write-Host "Generated $libFile"
          } else { Write-Host "$libFile already present" }

          # Ensure Python headers exist (they are architecture-neutral)
          $includeDir = Join-Path $pyDir "include"
          if (-not (Test-Path $includeDir)) {
            $ver        = Split-Path (Split-Path $pyDir -Parent) -Leaf
            $x64Include = "C:\hostedtoolcache\windows\Python\$ver\x64\include"
            if (Test-Path $x64Include) {
              Copy-Item -Recurse $x64Include $includeDir
              Write-Host "Copied headers from x64 to $includeDir"
            } else { Write-Error "No Python headers found at $x64Include"; exit 1 }
          } else { Write-Host "Headers already present at $includeDir" }

          # Expose the ARM64 Python executable path for the CMake configure step
          $exePath = (Join-Path $pyDir "python.exe") -replace "\\", "/"
          echo "PYTHON_ARM64_EXE=$exePath" >> $env:GITHUB_ENV

        # Cmd uses ^ to break commands into multiple lines, powershell uses `
      - name: Configure
        if: matrix.os != 'windows-11-arm'
        run: |
          cmake --version
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DLAGRANGE_JENKINS=ON `
            -DLAGRANGE_ALL=ON `
            -DLAGRANGE_POLYSCOPE_MOCK_BACKEND=ON `
            -B ${{ env.BUILD_DIR }} `
            -S .

        # Force CMake to use the ARM64 Python (now complete with dev files)
        # and skip the Windows registry so it doesn't fall back to x64 Python.
      - name: Configure (ARM64)
        if: matrix.os == 'windows-11-arm'
        run: |
          cmake --version
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DLAGRANGE_JENKINS=ON `
            -DLAGRANGE_ALL=ON `
            -DLAGRANGE_POLYSCOPE_MOCK_BACKEND=ON `
            -DPython_EXECUTABLE="$env:PYTHON_ARM64_EXE" `
            -DPython_FIND_REGISTRY=NEVER `
            -B ${{ env.BUILD_DIR }} `
            -S .

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} -j ${{ steps.cpu-cores.outputs.count }}

      - name: Sccache stats
        if: always()
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      - name: Show disk space
        if: always()
        run: Get-PSDrive

      - name: Tests
        run: cd ${{ env.BUILD_DIR }}; ctest --verbose -j ${{ steps.cpu-cores.outputs.count }}
